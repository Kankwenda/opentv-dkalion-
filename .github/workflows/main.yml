name: Construire APK OpenTV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Donner les permissions à Gradle
        run: chmod +x ./gradlew

      - name: Construire l'APK
        run: ./gradlew assembleDebug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-Dkalion-APK
          path: app/build/outputs/apk/**/*.apk
