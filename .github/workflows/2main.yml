name: Construire APK OpenTV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test et compilation APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Donner les permissions à Gradle
        run: chmod +x ./gradlew

      - name: Construire l'APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-Dkalion-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
